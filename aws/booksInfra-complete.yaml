AWSTemplateFormatVersion: "2010-09-09"
Description: "Template completo para criação da infraestrutura de livros (DynamoDB, S3 e Lambda)"

Resources:
  BooksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: books
      AttributeDefinitions:
        - AttributeName: autor
          AttributeType: S
        - AttributeName: genero
          AttributeType: S
      KeySchema:
        - AttributeName: autor
          KeyType: HASH
        - AttributeName: genero
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  BookStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: my-s3-books-cloudformation-test
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  BooksEtlExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: booksEtl-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/booksEtl*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt BooksTable.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt BookStorageBucket.Arn
                  - !Sub "${BookStorageBucket.Arn}/*"

  BooksEtlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: booksEtl
      Runtime: java21
      Handler: com.example.BooksEtlHandler::handleRequest
      Role: !GetAtt BooksEtlExecutionRole.Arn
      Code:
        S3Bucket: lambdaCode
        S3Key: booksEtl.jar
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          AWS_REGION: !Ref AWS::Region
      Description: "Função Lambda para processamento ETL de livros"
      DependsOn: BooksEtlExecutionRole

  BooksEtlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/booksEtl
      RetentionInDays: 14

Outputs:
  DynamoDbTableName:
    Description: Nome da tabela DynamoDB criada
    Value: !Ref BooksTable
    Export:
      Name: !Sub "${AWS::StackName}-DynamoDbTableName"

  DynamoDbTableArn:
    Description: ARN da tabela DynamoDB
    Value: !GetAtt BooksTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DynamoDbTableArn"

  DynamoDbTableStreamArn:
    Description: ARN do stream da tabela DynamoDB
    Value: !GetAtt BooksTable.StreamArn
    Export:
      Name: !Sub "${AWS::StackName}-DynamoDbTableStreamArn"

  BookStorageBucketName:
    Description: Nome do bucket S3 criado
    Value: !Ref BookStorageBucket
    Export:
      Name: !Sub "${AWS::StackName}-BookStorageBucketName"

  BookStorageBucketArn:
    Description: ARN do bucket S3
    Value: !GetAtt BookStorageBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BookStorageBucketArn"

  BookStorageBucketDomainName:
    Description: Nome de domínio do bucket S3
    Value: !GetAtt BookStorageBucket.DomainName
    Export:
      Name: !Sub "${AWS::StackName}-BookStorageBucketDomainName"

  FunctionName:
    Description: Nome da função Lambda criada
    Value: !Ref BooksEtlFunction
    Export:
      Name: !Sub "${AWS::StackName}-FunctionName"

  FunctionArn:
    Description: ARN da função Lambda
    Value: !GetAtt BooksEtlFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FunctionArn"

  FunctionRoleArn:
    Description: ARN da role de execução da função Lambda
    Value: !GetAtt BooksEtlExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FunctionRoleArn"
