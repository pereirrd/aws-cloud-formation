AWSTemplateFormatVersion: "2010-09-09"
Description: "Template para criação da função Lambda booksEtl"

Resources:
  BooksEtlExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: booksEtl-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/booksEtl*"

  BooksEtlFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: booksEtl
      Runtime: java21
      Handler: com.example.BooksEtlHandler::handleRequest
      Role: !GetAtt BooksEtlExecutionRole.Arn
      Code:
        S3Bucket: lambdaCode
        S3Key: booksEtl.jar
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          AWS_REGION: !Ref AWS::Region
      Description: "Função Lambda para processamento ETL de livros"

  BooksEtlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/booksEtl
      RetentionInDays: 14

Outputs:
  FunctionName:
    Description: Nome da função Lambda criada
    Value: !Ref BooksEtlFunction
    Export:
      Name: !Sub "${AWS::StackName}-FunctionName"

  FunctionArn:
    Description: ARN da função Lambda
    Value: !GetAtt BooksEtlFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FunctionArn"

  FunctionRoleArn:
    Description: ARN da role de execução da função Lambda
    Value: !GetAtt BooksEtlExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FunctionRoleArn"
